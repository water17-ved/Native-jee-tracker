name: Extract JEE Tracker Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    name: Extract Project Into Repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP="JEE-Tracker-Android-Firebase-Updated-Safe.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP not found:"
            echo "$ZIP"
            echo ""
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP found:"
          ls -lh "$ZIP"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o \
            "JEE-Tracker-Android-Firebase-Updated-Safe.zip" \
            -d extracted

          echo "ZIP contents:"
          find extracted -maxdepth 5 -type f | sort

      - name: Locate actual project root
        shell: bash
        run: |
          set -e

          echo "Searching for www/index.html..."

          INDEX_FILE=$(find extracted \
            -type f \
            -path "*/www/index.html" \
            | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: www/index.html could not be found."
            echo ""
            echo "Actual extracted files:"
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Found:"
          echo "$INDEX_FILE"

          PROJECT_ROOT=$(dirname "$(dirname "$INDEX_FILE")")

          echo "Detected project root:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "Checking project files..."

          test -f "$PROJECT_ROOT/www/index.html"
          test -f "$PROJECT_ROOT/www/schedule.html"
          test -f "$PROJECT_ROOT/www/test-analysis.html"

          test -f "$PROJECT_ROOT/package.json"
          test -f "$PROJECT_ROOT/capacitor.config.ts"
          test -f "$PROJECT_ROOT/tsconfig.json"

          test -f "$PROJECT_ROOT/native-android/apply-widgets.py"

          test -f "$PROJECT_ROOT/firebase/google-services.json"

          echo ""
          echo "All required files found."

      - name: Remove generated build files
        shell: bash
        run: |
          set -e

          rm -rf "$PROJECT_ROOT/android"
          rm -rf "$PROJECT_ROOT/node_modules"
          rm -rf "$PROJECT_ROOT/.gradle"

          echo "Generated build files removed."

      - name: Security check
        shell: bash
        run: |
          set -e

          echo "Checking for private credentials..."

          FORBIDDEN=$(find "$PROJECT_ROOT" \
            -type f \
            \( \
              -name "*.jks" \
              -o -name "*.keystore" \
              -o -name "*.p12" \
              -o -name "*.pem" \
              -o -name "*.key" \
              -o -name "firebase-adminsdk*.json" \
            \)

          if [ -n "$FORBIDDEN" ]; then
            echo "ERROR: Forbidden private files detected:"
            echo "$FORBIDDEN"
            exit 1
          fi

          echo "Security check passed."

      - name: Copy project to repository root
        shell: bash
        run: |
          set -e

          echo "Copying project..."

          # Remove everything except Git metadata and .github.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "extracted" \
            -exec rm -rf {} +

          # Copy the actual project.
          cp -a "$PROJECT_ROOT"/. .

          echo "Project copied."

      - name: Remove temporary files
        shell: bash
        run: |
          set -e

          rm -rf extracted
          rm -f "JEE-Tracker-Android-Firebase-Updated-Safe.zip"

          echo "Temporary ZIP and extraction directory removed."

      - name: Final verification
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINAL REPOSITORY CHECK"
          echo "======================================"

          test -f www/index.html
          test -f www/schedule.html
          test -f www/test-analysis.html
          test -f package.json
          test -f capacitor.config.ts
          test -f tsconfig.json
          test -f native-android/apply-widgets.py
          test -f firebase/google-services.json

          echo ""
          echo "SUCCESS."
          echo ""
          echo "Repository structure:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Commit extracted project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Extract JEE Tracker project"

          git push
