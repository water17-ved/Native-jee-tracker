name: Extract JEE Tracker Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    name: Extract Project Into Repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify ZIP
        shell: bash
        run: |
          set -e

          ZIP="JEE-Tracker-Android-Firebase-Updated-Safe.zip"

          test -f "$ZIP"

          echo "ZIP found:"
          ls -lh "$ZIP"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o \
            "JEE-Tracker-Android-Firebase-Updated-Safe.zip" \
            -d extracted

          echo "Extracted ZIP contents:"
          find extracted -maxdepth 3 -type f | sort

      - name: Verify extracted project
        shell: bash
        run: |
          set -e

          PROJECT="extracted/finalzip"

          echo "Using project root:"
          echo "$PROJECT"

          test -d "$PROJECT"
          test -f "$PROJECT/www/index.html"
          test -f "$PROJECT/www/schedule.html"
          test -f "$PROJECT/www/test-analysis.html"

          test -f "$PROJECT/package.json"
          test -f "$PROJECT/capacitor.config.ts"
          test -f "$PROJECT/tsconfig.json"

          test -f "$PROJECT/native-android/apply-widgets.py"
          test -f "$PROJECT/firebase/google-services.json"

          echo "Project verification successful."

      - name: Remove generated files
        shell: bash
        run: |
          set -e

          rm -rf extracted/finalzip/android
          rm -rf extracted/finalzip/node_modules
          rm -rf extracted/finalzip/.gradle

          echo "Generated build files removed."

      - name: Security check
        shell: bash
        run: |
          set -e

          FOUND=0

          while IFS= read -r FILE; do
            echo "FORBIDDEN FILE: $FILE"
            FOUND=1
          done < <(
            find extracted/finalzip -type f \
              \( \
                -name "*.jks" \
                -o -name "*.keystore" \
                -o -name "*.p12" \
                -o -name "*.pem" \
                -o -name "*.key" \
                -o -name "firebase-adminsdk*.json" \
              \)
          )

          if [ "$FOUND" -ne 0 ]; then
            echo "Private credential/signing files detected."
            exit 1
          fi

          echo "Security check passed."

      - name: Copy project to repository root
        shell: bash
        run: |
          set -e

          echo "Copying:"
          echo "extracted/finalzip/*"
          echo "to repository root."

          cp -a extracted/finalzip/. .

          echo "Project copied successfully."

      - name: Remove ZIP and temporary extraction
        shell: bash
        run: |
          set -e

          rm -rf extracted
          rm -f "JEE-Tracker-Android-Firebase-Updated-Safe.zip"

          echo "Temporary files removed."

      - name: Final verification
        shell: bash
        run: |
          set -e

          test -f www/index.html
          test -f www/schedule.html
          test -f www/test-analysis.html

          test -f package.json
          test -f capacitor.config.ts
          test -f tsconfig.json

          test -f native-android/apply-widgets.py
          test -f firebase/google-services.json

          echo ""
          echo "======================================"
          echo "EXTRACTION SUCCESSFUL"
          echo "======================================"
          echo ""

          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Commit extracted project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract JEE Tracker Android project"

          git push
