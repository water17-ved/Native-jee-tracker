name: Build JEE Tracker Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1


      # --------------------------------------------------
      # 2. Find ZIP
      # --------------------------------------------------
      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          find . -maxdepth 2 -type f | sort

          ZIP=$(find . -maxdepth 2 -type f \
            -name "*.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP"

          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 3. Extract ZIP
      # --------------------------------------------------
      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "$ZIP_PATH" -d extracted

          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort


      # --------------------------------------------------
      # 4. Detect actual project root
      # --------------------------------------------------
      - name: Detect project root
        shell: bash
        run: |
          set -e

          echo "Searching for project..."

          if [ -f "extracted/finalzip/package.json" ]; then
            PROJECT_ROOT="extracted/finalzip"

          elif [ -f "extracted/package.json" ]; then
            PROJECT_ROOT="extracted"

          else
            PROJECT_ROOT=$(find extracted \
              -mindepth 1 \
              -maxdepth 3 \
              -type f \
              -name "package.json" \
              -printf '%h\n' \
              | head -n 1)

          fi

          if [ -z "$PROJECT_ROOT" ] || [ ! -f "$PROJECT_ROOT/package.json" ]; then
            echo "ERROR: Could not find project root."
            echo ""
            echo "Extracted structure:"
            find extracted -maxdepth 5 -print | sort
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "======================================"
          echo "PROJECT ROOT"
          echo "======================================"
          echo "$PROJECT_ROOT"


      # --------------------------------------------------
      # 5. Verify source
      # --------------------------------------------------
      - name: Verify source project
        shell: bash
        run: |
          set -e

          PROJECT="$PROJECT_ROOT"

          test -f "$PROJECT/package.json"
          test -f "$PROJECT/capacitor.config.ts"
          test -f "$PROJECT/tsconfig.json"

          test -f "$PROJECT/www/index.html"
          test -f "$PROJECT/www/schedule.html"
          test -f "$PROJECT/www/test-analysis.html"

          test -f "$PROJECT/firebase/google-services.json"

          test -f "$PROJECT/native-android/apply-widgets.py"

          echo ""
          echo "======================================"
          echo "SOURCE VERIFICATION PASSED"
          echo "======================================"


      # --------------------------------------------------
      # 6. Prepare workspace
      # --------------------------------------------------
      - name: Prepare build workspace
        shell: bash
        run: |
          set -e

          rm -rf build-source
          mkdir -p build-source

          cp -a "$PROJECT_ROOT/." build-source/

          cd build-source

          echo "Build source:"
          find . -maxdepth 3 -type f | sort


      # --------------------------------------------------
      # 7. Security check
      # --------------------------------------------------
      - name: Security check
        shell: bash
        run: |
          set -e

          cd build-source

          FOUND=0

          while IFS= read -r FILE; do
            echo "FORBIDDEN FILE: $FILE"
            FOUND=1
          done < <(
            find . -type f \
              \( \
                -name "*.jks" \
                -o -name "*.keystore" \
                -o -name "*.p12" \
                -o -name "*.pem" \
                -o -name "*.key" \
                -o -name "firebase-adminsdk*.json" \
                -o -name ".env" \
                -o -name ".env.*" \
              \)
          )

          if [ "$FOUND" -ne 0 ]; then
            echo ""
            echo "ERROR: Private credential/signing files detected."
            exit 1
          fi

          echo "Security check passed."


      # --------------------------------------------------
      # 8. Setup Node
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20


      # --------------------------------------------------
      # 9. Setup Java
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17


      # --------------------------------------------------
      # 10. Install npm dependencies
      # --------------------------------------------------
      - name: Install npm dependencies
        working-directory: build-source
        shell: bash
        run: |
          set -e

          npm install

          echo ""
          echo "npm installation completed."


      # --------------------------------------------------
      # 11. Add Android platform
      # --------------------------------------------------
      - name: Add Capacitor Android
        working-directory: build-source
        shell: bash
        run: |
          set -e

          if [ -d "android" ]; then
            echo "Android directory already exists."
          else
            npx cap add android
          fi


      # --------------------------------------------------
      # 12. Copy Firebase configuration
      # --------------------------------------------------
      - name: Configure Firebase
        working-directory: build-source
        shell: bash
        run: |
          set -e

          test -f firebase/google-services.json

          mkdir -p android/app

          cp firebase/google-services.json \
            android/app/google-services.json

          echo "Firebase configuration copied."


      # --------------------------------------------------
      # 13. Apply native widgets
      # --------------------------------------------------
      - name: Apply native Android widgets
        working-directory: build-source
        shell: bash
        run: |
          set -e

          if [ -f "native-android/apply-widgets.py" ]; then
            python3 native-android/apply-widgets.py
          else
            echo "Native widget script not found."
            exit 1
          fi


      # --------------------------------------------------
      # 14. Capacitor sync
      # --------------------------------------------------
      - name: Capacitor sync
        working-directory: build-source
        shell: bash
        run: |
          set -e

          npx cap sync android

          echo "Capacitor sync completed."


      # --------------------------------------------------
      # 15. Verify Android project
      # --------------------------------------------------
      - name: Verify Android project
        working-directory: build-source
        shell: bash
        run: |
          set -e

          test -d android
          test -f android/gradlew
          test -f android/app/google-services.json

          chmod +x android/gradlew

          echo ""
          echo "Android project ready."


      # --------------------------------------------------
      # 16. Build DEBUG APK
      # --------------------------------------------------
      - name: Build debug APK
        working-directory: build-source/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          echo ""
          echo "======================================"
          echo "DEBUG BUILD COMPLETED"
          echo "======================================"


      # --------------------------------------------------
      # 17. Locate APK
      # --------------------------------------------------
      - name: Locate APK
        working-directory: build-source
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          mkdir -p ../apk-output
          cp "$APK" ../apk-output/JEE-Tracker-debug.apk


      # --------------------------------------------------
      # 18. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -f apk-output/JEE-Tracker-debug.apk

          SIZE=$(stat -c%s apk-output/JEE-Tracker-debug.apk)

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK looks suspiciously small."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK VERIFIED"
          echo "======================================"
          echo "File: apk-output/JEE-Tracker-debug.apk"
          echo "Size: $SIZE bytes"


      # --------------------------------------------------
      # 19. Upload APK
      # --------------------------------------------------
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Tracker-debug-APK
          path: apk-output/JEE-Tracker-debug.apk
          if-no-files-found: error
          retention-days: 30
