name: JEE Tracker Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build JEE Tracker APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Extract the supplied Android project package
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP="JEE-Tracker-Android-Firebase-Updated-Safe.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 3 -type f | sort

      # 3. Copy the actual application source
      - name: Prepare project files
        shell: bash
        run: |
          set -e

          cp -a extracted/www .
          cp -a extracted/package.json .
          cp -a extracted/capacitor.config.ts .
          cp -a extracted/tsconfig.json .
          cp -a extracted/native-android .
          cp -a extracted/firebase .

      # 4. Verify the important source files
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "Checking required files..."

          test -f www/index.html
          test -f www/schedule.html
          test -f www/test-analysis.html

          test -f www/ai-file-reader.js
          test -f www/jee-native-files.js
          test -f www/jee-native-storage.js
          test -f www/jee-ai-android.js
          test -f www/jee-android-native.js
          test -f www/jee-android-hardening.js
          test -f www/jee-capacitor-bridge.js
          test -f www/jee-network-status.js

          test -f package.json
          test -f capacitor.config.ts
          test -f tsconfig.json

          test -f native-android/apply-widgets.py

          test -f firebase/google-services.json

          echo "Project structure verified successfully."

      # 5. Set up Node
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # 6. Set up Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 7. Set up Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 8. Install npm dependencies
      - name: Install dependencies
        shell: bash
        run: |
          set -e
          npm install --no-audit --no-fund

      # 9. Create the Capacitor Android project
      - name: Create Android project
        shell: bash
        run: |
          set -e

          npx cap add android

      # 10. Apply native Android widgets
      - name: Apply native widgets
        shell: bash
        run: |
          set -e

          python3 native-android/apply-widgets.py

      # 11. Add Firebase configuration
      - name: Configure Firebase
        shell: bash
        run: |
          set -e

          test -f firebase/google-services.json

          mkdir -p android/app

          cp firebase/google-services.json \
             android/app/google-services.json

          echo "Firebase configuration copied."

      # 12. Sync Capacitor
      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          npx cap sync android

      # 13. Verify Android project
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f android/gradlew
          test -f android/app/google-services.json

          echo "Android project verified."

      # 14. Build debug APK
      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      # 15. Verify APK exists
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 16. Extract the APK signing certificate
      - name: Extract APK SHA-1
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --print-certs \
            "$APK" > certificate-info.txt

          cat certificate-info.txt

      # 17. Save Firebase SHA-1
      - name: Save Firebase SHA-1
        shell: bash
        run: |
          set -e

          grep -i "SHA-1 digest:" certificate-info.txt \
            > firebase-debug-sha1.txt

          if [ ! -s firebase-debug-sha1.txt ]; then
            echo "ERROR: SHA-1 certificate digest was not found."
            exit 1
          fi

          cat firebase-debug-sha1.txt

      # 18. Generate APK SHA-256 checksum
      - name: Generate APK SHA-256
        shell: bash
        run: |
          set -e

          sha256sum \
            android/app/build/outputs/apk/debug/app-debug.apk \
            > app-debug.apk.sha256

          cat app-debug.apk.sha256

      # 19. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jee-tracker-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error

      # 20. Upload certificate information
      - name: Upload Firebase SHA-1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firebase-debug-sha1
          path: |
            firebase-debug-sha1.txt
            certificate-info.txt
          if-no-files-found: error
