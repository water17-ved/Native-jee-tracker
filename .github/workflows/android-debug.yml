name: Build JEE Tracker Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'

jobs:
  build-debug:
    name: Extract and Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate latest project ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name '*.zip' \
              -printf '%f\n' \
              | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi

          echo "ZIP files found:"
          printf ' - %s\n' "${ZIPS[@]}"

          latest_name=""
          latest_time=-1

          for zip_name in "${ZIPS[@]}"; do
            commit_time="$(
              git log -1 \
                --format=%ct \
                -- "$zip_name" 2>/dev/null || true
            )"

            [ -z "$commit_time" ] && commit_time=0

            if [ "$commit_time" -gt "$latest_time" ]; then
              latest_time="$commit_time"
              latest_name="$zip_name"

            elif [ "$commit_time" -eq "$latest_time" ] &&
                 [[ "$zip_name" > "$latest_name" ]]; then
              latest_name="$zip_name"
            fi
          done

          if [ -z "$latest_name" ]; then
            echo "ERROR: Could not determine latest ZIP."
            exit 1
          fi

          echo "zip_name=$latest_name" >> "$GITHUB_OUTPUT"

          echo "Using project ZIP:"
          echo "$latest_name"

      - name: Verify project ZIP
        env:
          ZIP_NAME: ${{ steps.locate_zip.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/$ZIP_NAME"

          echo "Testing ZIP integrity..."
          unzip -tq "$ZIP"

          REQUIRED=(
            package.json
            capacitor.config.ts
            tsconfig.json

            www/index.html
            www/schedule.html
            www/test-analysis.html
            www/jee-android-native.js
            www/jee-widgets.js
            www/native-touch.css

            native-android/apply-widgets.py

            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeWidgetsPlugin.java
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeWidgetProvider.java
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeMarksWidgetProvider.java
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeFocusWidgetProvider.java

            firebase/google-services.json

            assets/icon-only.png
            assets/logo.png

            www/icon-192.png
            www/icon-512.png
          )

          LISTING="$(unzip -Z1 "$ZIP")"

          echo "Checking required files..."

          for f in "${REQUIRED[@]}"; do
            if ! printf '%s\n' "$LISTING" | grep -Fxq "$f"; then
              echo "ERROR: ZIP is missing required file:"
              echo "$f"
              exit 1
            fi
          done

          echo "Project ZIP verification PASSED."

      - name: Extract project ZIP
        env:
          ZIP_NAME: ${{ steps.locate_zip.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o \
            "$GITHUB_WORKSPACE/$ZIP_NAME" \
            -d extracted

          test -f extracted/package.json

          echo "Project extracted successfully."

      - name: Validate Firebase Android identity
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("firebase/google-services.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: firebase/google-services.json is missing"
              )

          data = json.loads(path.read_text())

          expected_package = "com.vedplayer.jeetracker"

          expected_app_id = (
              "1:450231967529:android:"
              "edd1b09ea64992d071e138"
          )

          clients = data.get("client", [])

          if not clients:
              raise SystemExit(
                  "ERROR: No Firebase client entries found."
              )

          matching_client = None

          for client in clients:
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              print(
                  "Found Firebase client package:",
                  package_name
              )

              if package_name == expected_package:
                  matching_client = client
                  break

          if matching_client is None:
              raise SystemExit(
                  "ERROR: Firebase Android package "
                  f"{expected_package} was not found."
              )

          app_id = matching_client.get(
              "mobilesdk_app_id"
          )

          if not app_id:
              raise SystemExit(
                  "ERROR: Matching Firebase Android client "
                  "has no mobilesdk_app_id."
              )

          if app_id != expected_app_id:
              raise SystemExit(
                  "ERROR: Wrong Firebase Android App ID.\n"
                  f"Expected: {expected_app_id}\n"
                  f"Found:    {app_id}"
              )

          print("")
          print(
              "Firebase Android package:",
              expected_package
          )

          print(
              "Firebase Android App ID:",
              app_id
          )

          print("Firebase identity PASSED.")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java 21
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo ""
          echo "Javac:"
          javac -version

          JAVA_MAJOR="$(
            java -version 2>&1 |
            sed -n 's/.*version "\([0-9]*\).*/\1/p' |
            head -n 1
          )"

          if [ "$JAVA_MAJOR" != "21" ]; then
            echo "ERROR: Java 21 is required."
            echo "Detected Java: $JAVA_MAJOR"
            exit 1
          fi

          echo "Java 21 validation PASSED."

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate npm project
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require('fs');

          const p = JSON.parse(
            fs.readFileSync('./package.json', 'utf8')
          );

          const required = [
            ['dependencies', '@capacitor/core'],
            ['dependencies', '@capacitor/haptics'],
            ['dependencies', '@capacitor/local-notifications'],
            ['dependencies', '@capacitor-firebase/authentication'],
            ['devDependencies', '@capacitor/cli'],
            ['devDependencies', '@capacitor/android']
          ];

          for (const [group, name] of required) {
            if (!p[group] || !p[group][name]) {
              console.error(
                `Missing ${group}.${name}`
              );
              process.exit(1);
            }
          }

          console.log(
            'package.json validation PASSED.'
          );
          NODE

      - name: Install npm dependencies
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --no-audit \
            --no-fund \
            --no-progress

      - name: Enable native Google Sign-In
        shell: bash
        run: |
          echo "JEE_NATIVE_GOOGLE_AUTH=1" >> "$GITHUB_ENV"

          echo "Native Google Sign-In enabled."

      - name: Add Capacitor Android
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          npx cap add android

      - name: Apply native Android widgets
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          python3 native-android/apply-widgets.py

          echo "Native Android widgets applied."

      - name: Configure Firebase Android
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app

          cp \
            firebase/google-services.json \
            android/app/google-services.json

          test -s android/app/google-services.json

          echo "Firebase configuration copied."

      - name: Configure Firebase Gradle integration
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          variables = Path("android/variables.gradle")
          root_gradle = Path("android/build.gradle")
          app_gradle = Path("android/app/build.gradle")

          # -----------------------------------------------------
          # variables.gradle
          # -----------------------------------------------------

          text = variables.read_text()

          if "rgcfaIncludeGoogle" not in text:

              if "ext {" in text:
                  text = text.replace(
                      "ext {",
                      "ext {\n"
                      "    rgcfaIncludeGoogle = true\n"
                      "    androidxCredentialsVersion = '1.3.0'",
                      1
                  )

              else:
                  text += (
                      "\n"
                      "ext {\n"
                      "    rgcfaIncludeGoogle = true\n"
                      "    androidxCredentialsVersion = '1.3.0'\n"
                      "}\n"
                  )

          else:

              lines = text.splitlines()
              output = []

              for line in lines:
                  if "rgcfaIncludeGoogle" in line:
                      indent = line[
                          :len(line) - len(line.lstrip())
                      ]

                      output.append(
                          indent +
                          "rgcfaIncludeGoogle = true"
                      )
                  else:
                      output.append(line)

              text = "\n".join(output) + "\n"

              if (
                  "androidxCredentialsVersion"
                  not in text
              ):
                  text = text.replace(
                      "rgcfaIncludeGoogle = true",
                      "rgcfaIncludeGoogle = true\n"
                      "    androidxCredentialsVersion = '1.3.0'",
                      1
                  )

          variables.write_text(text)

          # -----------------------------------------------------
          # Root build.gradle
          # -----------------------------------------------------

          text = root_gradle.read_text()

          if "com.google.gms:google-services" not in text:

              marker = "dependencies {"
              position = text.find(marker)

              if position == -1:
                  raise SystemExit(
                      "ERROR: Could not find "
                      "buildscript dependencies in "
                      "android/build.gradle"
                  )

              insert_position = (
                  position + len(marker)
              )

              text = (
                  text[:insert_position]
                  + "\n"
                  + "        classpath "
                  + "'com.google.gms:google-services:4.5.0'"
                  + text[insert_position:]
              )

          root_gradle.write_text(text)

          # -----------------------------------------------------
          # App build.gradle
          # -----------------------------------------------------

          text = app_gradle.read_text()

          if (
              "com.google.gms.google-services"
              not in text
          ):
              text += (
                  "\n\n"
                  "apply plugin: "
                  "'com.google.gms.google-services'\n"
              )

          app_gradle.write_text(text)

          print(
              "Firebase Gradle integration configured."
          )
          PY

      - name: Sync Capacitor
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

      - name: Prepare Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="$HOME/.android"
          KEYSTORE="$ANDROID_DIR/debug.keystore"

          mkdir -p "$ANDROID_DIR"

          if [ ! -f "$KEYSTORE" ]; then

            echo "Creating debug keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname \
              "CN=Android Debug,O=Android,C=US"

          else

            echo "Existing debug keystore found."

          fi

          test -f "$KEYSTORE"

          echo "Debug keystore ready."

      - name: Verify generated Android project
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradlew
          test -f android/app/google-services.json
          test -f android/app/src/main/AndroidManifest.xml

          grep -q \
            "JeeWidgetProvider" \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "JeeMarksWidgetProvider" \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "JeeFocusWidgetProvider" \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle

          grep -q \
            "com.google.gms:google-services:4.5.0" \
            android/build.gradle

          echo "Generated Android project validation PASSED."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show build environment
        working-directory: extracted/android
        shell: bash
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== JAVAC ====="
          javac -version

          echo ""
          echo "===== GRADLE ====="

          chmod +x gradlew

          ./gradlew --version

      - name: Generate signing report
        working-directory: extracted/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew signingReport \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../signing-report.txt

      - name: Build debug APK
        working-directory: extracted/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log

      - name: Verify APK
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK is suspiciously small."
            exit 1
          fi

          sha256sum "$APK" \
            | tee app-debug.apk.sha256

          echo "APK verification PASSED."

      - name: Upload debug APK and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Tracker-debug-APK
          path: |
            extracted/android/app/build/outputs/apk/debug/app-debug.apk
            extracted/app-debug.apk.sha256
            extracted/signing-report.txt
            extracted/gradle-build.log
          if-no-files-found: warn
          retention-days: 30
