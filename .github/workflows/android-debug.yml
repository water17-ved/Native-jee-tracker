name: Build JEE Tracker Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  PROJECT_ZIP: "JEE-Tracker-Android-Logo-Final.zip"

jobs:
  build-debug:
    name: Extract and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # --------------------------------------------------
      # 1. Get repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --------------------------------------------------
      # 3. Setup Java
      #
      # IMPORTANT:
      # No Gradle cache here.
      # The ZIP has not been extracted yet, so Android/Gradle
      # files do not exist at this point.
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # --------------------------------------------------
      # 4. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 5. Check that the expected ZIP exists
      # --------------------------------------------------
      - name: Check project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$GITHUB_WORKSPACE/$PROJECT_ZIP" ]; then
            echo "ERROR: Project ZIP not found:"
            echo "$GITHUB_WORKSPACE/$PROJECT_ZIP"
            echo ""
            echo "ZIP files actually present:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              -print
            exit 1
          fi

          echo "Project ZIP found:"
          echo "$GITHUB_WORKSPACE/$PROJECT_ZIP"

      # --------------------------------------------------
      # 6. Verify ZIP structure BEFORE extraction
      # --------------------------------------------------
      - name: Verify ZIP structure
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/$PROJECT_ZIP"

          echo "Checking ZIP contents..."

          unzip -tq "$ZIP"

          REQUIRED_FILES=(
            "package.json"
            "capacitor.config.ts"
            "www/index.html"
            "www/schedule.html"
            "www/test-analysis.html"
            "assets/icon-only.png"
            "assets/logo.png"
            "www/icon-192.png"
            "www/icon-512.png"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if ! unzip -Z1 "$ZIP" | grep -Fxq "$FILE"; then
              echo "ERROR: Required file missing from ZIP:"
              echo "$FILE"
              exit 1
            fi
          done

          echo "ZIP integrity and required structure verified."

      # --------------------------------------------------
      # 7. Extract ZIP
      # --------------------------------------------------
      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/$PROJECT_ZIP"
          EXTRACT_DIR="$GITHUB_WORKSPACE/_extracted_project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting:"
          echo "$ZIP"

          unzip -q -o "$ZIP" -d "$EXTRACT_DIR"

          echo "Extraction complete."

      # --------------------------------------------------
      # 8. Find actual project root
      # --------------------------------------------------
      - name: Locate extracted project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$GITHUB_WORKSPACE/_extracted_project"

          PACKAGE_JSON="$(
            find "$EXTRACT_DIR" \
              -type f \
              -name "package.json" \
              -print -quit
          )"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found after extraction."
            find "$EXTRACT_DIR" -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"

          echo "Project root:"
          echo "$PROJECT_DIR"

          # Verify project root.
          test -f "$PROJECT_DIR/package.json"
          test -f "$PROJECT_DIR/capacitor.config.ts"
          test -f "$PROJECT_DIR/www/index.html"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 9. Show extracted structure
      # --------------------------------------------------
      - name: Verify extracted project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Project files:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "Checking required files..."

          test -f package.json
          test -f capacitor.config.ts

          test -f www/index.html
          test -f www/schedule.html
          test -f www/test-analysis.html

          test -f assets/icon-only.png
          test -f assets/logo.png

          test -f www/icon-192.png
          test -f www/icon-512.png

          echo "All required project files are present."

      # --------------------------------------------------
      # 10. Install npm dependencies
      # --------------------------------------------------
      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund

      # --------------------------------------------------
      # 11. Create Android project
      # --------------------------------------------------
      - name: Add Capacitor Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android

      # --------------------------------------------------
      # 12. Generate Android icons from supplied logo
      # --------------------------------------------------
      - name: Generate Android app icons
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npx @capacitor/assets@3.0.5 generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor "#65001f" \
            --iconBackgroundColorDark "#65001f"

      # --------------------------------------------------
      # 13. Sync web project into Android
      # --------------------------------------------------
      - name: Sync Capacitor Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

      # --------------------------------------------------
      # 14. Verify Android project NOW
      # --------------------------------------------------
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/app/build.gradle

          echo "Android project successfully generated."

          echo ""
          echo "Gradle files:"
          find android -maxdepth 3 \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle-wrapper.properties" \) \
            -print | sort

      # --------------------------------------------------
      # 15. Setup Gradle AFTER extraction and cap add
      #
      # This is intentionally here.
      # Gradle files now exist.
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # --------------------------------------------------
      # 16. Build APK
      # --------------------------------------------------
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # 17. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

          echo ""
          echo "APK SHA-256:"
          sha256sum "$APK" | tee app-debug.apk.sha256

      # --------------------------------------------------
      # 18. Upload APK
      # --------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jee-tracker-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.PROJECT_DIR }}/app-debug.apk.sha256
          if-no-files-found: error
