name: Build JEE Tracker Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'

jobs:
  build-debug:
    name: Extract and Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ---------------------------------------------------------
      # FIND LATEST ZIP
      # ---------------------------------------------------------

      - name: Locate latest project ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name '*.zip' \
              -printf '%f\n' \
              | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi

          echo "ZIP files found:"
          printf ' - %s\n' "${ZIPS[@]}"

          latest_name=""
          latest_time=-1

          for zip_name in "${ZIPS[@]}"; do

            commit_time="$(
              git log \
                -1 \
                --format=%ct \
                -- "$zip_name" 2>/dev/null || true
            )"

            if [ -z "$commit_time" ]; then
              commit_time=0
            fi

            if [ "$commit_time" -gt "$latest_time" ]; then
              latest_time="$commit_time"
              latest_name="$zip_name"

            elif [ "$commit_time" -eq "$latest_time" ] &&
                 [[ "$zip_name" > "$latest_name" ]]; then
              latest_name="$zip_name"
            fi

          done

          if [ -z "$latest_name" ]; then
            echo "ERROR: Could not determine latest project ZIP."
            exit 1
          fi

          echo "zip_name=$latest_name" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================="
          echo "LATEST PROJECT ZIP"
          echo "=========================================="
          echo "$latest_name"
          echo "=========================================="


      # ---------------------------------------------------------
      # VERIFY ZIP
      # ---------------------------------------------------------

      - name: Verify project ZIP
        env:
          ZIP_NAME: ${{ steps.locate_zip.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/$ZIP_NAME"

          echo "Testing ZIP integrity..."
          unzip -tq "$ZIP"

          echo "ZIP integrity PASSED."

          REQUIRED=(
            package.json
            capacitor.config.ts
            tsconfig.json

            www/index.html
            www/schedule.html
            www/test-analysis.html
            www/jee-android-native.js
            www/jee-widgets.js
            www/native-touch.css

            native-android/apply-widgets.py

            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeWidgetsPlugin.java
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeWidgetProvider.java
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeMarksWidgetProvider.java
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeFocusWidgetProvider.java

            firebase/google-services.json

            assets/icon-only.png
            assets/logo.png

            www/icon-192.png
            www/icon-512.png
          )

          LISTING="$(unzip -Z1 "$ZIP")"

          echo ""
          echo "Checking required files..."

          for f in "${REQUIRED[@]}"; do
            if ! printf '%s\n' "$LISTING" | grep -Fxq "$f"; then
              echo ""
              echo "ERROR: Required file missing:"
              echo "$f"
              echo ""
              exit 1
            fi
          done

          echo ""
          echo "All required files are present."
          echo "Project ZIP verification PASSED."


      # ---------------------------------------------------------
      # EXTRACT
      # ---------------------------------------------------------

      - name: Extract project ZIP
        env:
          ZIP_NAME: ${{ steps.locate_zip.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o \
            "$GITHUB_WORKSPACE/$ZIP_NAME" \
            -d extracted

          if [ ! -f extracted/package.json ]; then
            echo "ERROR: package.json was not extracted."
            exit 1
          fi

          echo "Project extracted successfully."


      # ---------------------------------------------------------
      # FIREBASE VALIDATION
      # ---------------------------------------------------------

      - name: Validate Firebase Android identity
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("firebase/google-services.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: firebase/google-services.json is missing"
              )

          data = json.loads(path.read_text())

          client = data["client"][0]

          package_name = (
              client["client_info"]
              ["android_client_info"]
              ["package_name"]
          )

          app_id = client["mobilesdk_app_id"]

          expected_package = "com.vedplayer.jeetracker"

          expected_app_id = (
              "1:450231967529:android:"
              "edd1b09ea64992d071e138"
          )

          if package_name != expected_package:
              raise SystemExit(
                  f"ERROR: Wrong Firebase package: {package_name}"
              )

          if app_id != expected_app_id:
              raise SystemExit(
                  f"ERROR: Wrong Firebase app ID: {app_id}"
              )

          print("Firebase package:", package_name)
          print("Firebase app ID:", app_id)
          print("Firebase identity PASSED.")
          PY


      # ---------------------------------------------------------
      # NODE
      # ---------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # ---------------------------------------------------------
      # JAVA 21
      # ---------------------------------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      - name: Verify Java 21
        shell: bash
        run: |
          set -euo pipefail

          echo "Java version:"
          java -version

          echo ""
          echo "Javac version:"
          javac -version

          JAVA_MAJOR="$(
            java -version 2>&1 |
            sed -n 's/.*version "\([0-9]*\).*/\1/p' |
            head -n 1
          )"

          if [ "$JAVA_MAJOR" != "21" ]; then
            echo ""
            echo "ERROR: Java 21 is required."
            echo "Detected Java: $JAVA_MAJOR"
            exit 1
          fi

          echo ""
          echo "Java 21 validation PASSED."


      # ---------------------------------------------------------
      # ANDROID SDK
      # ---------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ---------------------------------------------------------
      # PACKAGE VALIDATION
      # ---------------------------------------------------------

      - name: Validate npm project
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const p = JSON.parse(
            fs.readFileSync('./package.json', 'utf8')
          );

          const required = [
            ['dependencies', '@capacitor/core'],
            ['dependencies', '@capacitor/haptics'],
            ['dependencies', '@capacitor/local-notifications'],
            ['dependencies', '@capacitor-firebase/authentication'],
            ['devDependencies', '@capacitor/cli'],
            ['devDependencies', '@capacitor/android']
          ];

          for (const [group, name] of required) {
            if (!p[group] || !p[group][name]) {
              console.error(
                `Missing ${group}.${name}`
              );
              process.exit(1);
            }
          }

          console.log(
            'package.json validation PASSED.'
          );
          NODE


      # ---------------------------------------------------------
      # NPM INSTALL
      # ---------------------------------------------------------

      - name: Install npm dependencies
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --no-audit \
            --no-fund \
            --no-progress


      # ---------------------------------------------------------
      # NATIVE GOOGLE AUTH
      # ---------------------------------------------------------

      - name: Enable native Google Sign-In
        shell: bash
        run: |
          echo "JEE_NATIVE_GOOGLE_AUTH=1" >> "$GITHUB_ENV"

          echo "Native Google Sign-In enabled."


      # ---------------------------------------------------------
      # CAPACITOR ANDROID
      # ---------------------------------------------------------

      - name: Add Capacitor Android
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          npx cap add android


      # ---------------------------------------------------------
      # APPLY WIDGETS
      # ---------------------------------------------------------

      - name: Apply native Android widgets
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          python3 native-android/apply-widgets.py

          echo "Native Android widgets applied."


      # ---------------------------------------------------------
      # FIREBASE JSON
      # ---------------------------------------------------------

      - name: Configure Firebase Android
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app

          cp \
            firebase/google-services.json \
            android/app/google-services.json

          if [ ! -s android/app/google-services.json ]; then
            echo "ERROR: Firebase google-services.json is empty."
            exit 1
          fi

          echo "Firebase Android configuration copied."


      # ---------------------------------------------------------
      # FIREBASE GRADLE
      # ---------------------------------------------------------

      - name: Configure Firebase Gradle integration
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          VARIABLES="android/variables.gradle"
          ROOT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"

          test -f "$VARIABLES"
          test -f "$ROOT_GRADLE"
          test -f "$APP_GRADLE"

          echo "Configuring Firebase Gradle integration..."

          # -----------------------------------------------------
          # variables.gradle
          # -----------------------------------------------------

          if grep -q "rgcfaIncludeGoogle" "$VARIABLES"; then

            sed -i \
              "s/rgcfaIncludeGoogle = .*/rgcfaIncludeGoogle = true/" \
              "$VARIABLES"

          else

            printf '%s\n' \
              '' \
              'ext {' \
              '    rgcfaIncludeGoogle = true' \
              "    androidxCredentialsVersion = '1.3.0'" \
              '}' \
              >> "$VARIABLES"

          fi

          # -----------------------------------------------------
          # Root build.gradle
          # -----------------------------------------------------

          if ! grep -q \
            "com.google.gms:google-services" \
            "$ROOT_GRADLE"; then

            printf '%s\n' \
              '' \
              'buildscript {' \
              '    dependencies {' \
              "        classpath 'com.google.gms:google-services:4.5.0'" \
              '    }' \
              '}' \
              >> "$ROOT_GRADLE"

          fi

          # -----------------------------------------------------
          # App build.gradle
          # -----------------------------------------------------

          if ! grep -q \
            "com.google.gms.google-services" \
            "$APP_GRADLE"; then

            printf '%s\n' \
              '' \
              "apply plugin: 'com.google.gms.google-services'" \
              >> "$APP_GRADLE"

          fi

          echo ""
          echo "Firebase Gradle integration configured."


      # ---------------------------------------------------------
      # CAPACITOR SYNC
      # ---------------------------------------------------------

      - name: Sync Capacitor
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android


      # ---------------------------------------------------------
      # DEBUG KEYSTORE
      # ---------------------------------------------------------

      - name: Prepare Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="$HOME/.android"
          KEYSTORE="$ANDROID_DIR/debug.keystore"

          mkdir -p "$ANDROID_DIR"

          if [ ! -f "$KEYSTORE" ]; then

            echo "Creating Android debug keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else

            echo "Existing Android debug keystore found."

          fi

          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: Debug keystore was not created."
            exit 1
          fi

          echo ""
          echo "Debug keystore ready:"
          echo "$KEYSTORE"


      # ---------------------------------------------------------
      # VERIFY GENERATED ANDROID PROJECT
      # ---------------------------------------------------------

      - name: Verify generated Android project
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradlew
          test -f android/app/google-services.json
          test -f android/app/src/main/AndroidManifest.xml

          grep -q \
            "JeeWidgetProvider" \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "JeeMarksWidgetProvider" \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "JeeFocusWidgetProvider" \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle

          grep -q \
            "google-services:4.5.0" \
            android/build.gradle

          echo "Generated Android project validation PASSED."


      # ---------------------------------------------------------
      # GRADLE
      # ---------------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6


      # ---------------------------------------------------------
      # BUILD ENVIRONMENT
      # ---------------------------------------------------------

      - name: Show Android build environment
        working-directory: extracted/android
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "JAVAC"
          echo "=========================================="

          javac -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew --version


      # ---------------------------------------------------------
      # SIGNING REPORT
      # ---------------------------------------------------------

      - name: Generate signing report
        working-directory: extracted/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew signingReport \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../signing-report.txt


      # ---------------------------------------------------------
      # BUILD APK
      # ---------------------------------------------------------

      - name: Build debug APK
        working-directory: extracted/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log


      # ---------------------------------------------------------
      # VERIFY APK
      # ---------------------------------------------------------

      - name: Verify APK
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: Debug APK is empty."
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"

          echo ""
          echo "=========================================="
          echo "APK"
          echo "=========================================="

          echo "APK: $APK"
          echo "Size: $SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK is suspiciously small."
            exit 1
          fi

          sha256sum "$APK" \
            | tee app-debug.apk.sha256

          echo ""
          echo "APK verification PASSED."


      # ---------------------------------------------------------
      # UPLOAD APK + LOGS
      # ---------------------------------------------------------

      - name: Upload debug APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Tracker-debug-APK
          path: |
            extracted/android/app/build/outputs/apk/debug/app-debug.apk
            extracted/app-debug.apk.sha256
            extracted/signing-report.txt
            extracted/gradle-build.log
          if-no-files-found: warn
          retention-days: 30
