name: Build JEE Tracker Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate latest project ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi

          echo "Found ${#ZIPS[@]} project ZIP(s):"
          printf ' - %s\n' "${ZIPS[@]}"

          # Select the ZIP from the newest Git commit that touched it.
          latest_name=""
          latest_time=-1

          for zip_name in "${ZIPS[@]}"; do
            commit_time="$(git log -1 --format=%ct -- "$zip_name" 2>/dev/null || true)"

            if [ -z "$commit_time" ]; then
              commit_time=0
            fi

            echo "Git timestamp: $commit_time -> $zip_name"

            if [ "$commit_time" -gt "$latest_time" ]; then
              latest_time="$commit_time"
              latest_name="$zip_name"
            elif [ "$commit_time" -eq "$latest_time" ] &&
                 [[ "$zip_name" > "$latest_name" ]]; then
              latest_name="$zip_name"
            fi
          done

          if [ -z "$latest_name" ]; then
            echo "ERROR: Could not determine the latest project ZIP."
            exit 1
          fi

          echo "zip_name=$latest_name" >> "$GITHUB_OUTPUT"
          echo "Using latest project ZIP: $latest_name"

      - name: Verify latest project ZIP
        shell: bash
        env:
          ZIP_NAME: ${{ steps.locate_zip.outputs.zip_name }}
        run: |
          set -euo pipefail

          test -f "$ZIP_NAME"

          echo "Verifying: $ZIP_NAME"

          unzip -tq "$ZIP_NAME"

          required=(
            package.json
            capacitor.config.ts
            tsconfig.json
            www/index.html
            www/schedule.html
            www/test-analysis.html
            www/jee-android-native.js
            www/jee-widgets.js
            www/native-touch.css
            native-android/apply-widgets.py
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeWidgetsPlugin.java
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeTodayWidgetProvider.java
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeTestScoreWidgetProvider.java
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeNextMissionWidgetProvider.java
            firebase/google-services.json
            assets/icon-only.png
            assets/logo.png
            www/icon-192.png
            www/icon-512.png
          )

          for path in "${required[@]}"; do
            if ! unzip -Z1 "$ZIP_NAME" | grep -Fxq "$path"; then
              echo "ERROR: Missing required file in ZIP: $path"
              exit 1
            fi
          done

          echo "ZIP integrity and required-file checks passed."

      - name: Extract latest project
        env:
          ZIP_NAME: ${{ steps.locate_zip.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_NAME" -d extracted

          if [ ! -f extracted/package.json ]; then
            echo "ERROR: package.json is not at the extracted project root."
            echo "The selected ZIP must contain package.json at its top level."

            find extracted -maxdepth 2 -type f | sort | head -80

            exit 1
          fi

      - name: Validate package.json
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const p = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          const required = [
            ['dependencies', '@capacitor/core'],
            ['dependencies', '@capacitor/haptics'],
            ['dependencies', '@capacitor/local-notifications'],
            ['dependencies', '@capacitor-firebase/authentication'],
            ['devDependencies', '@capacitor/cli'],
            ['devDependencies', '@capacitor/android']
          ];

          for (const [group, name] of required) {
            if (!p[group] || !p[group][name]) {
              throw new Error(`Missing ${group}.${name}`);
            }
          }

          console.log('package.json dependency checks passed.');
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install npm dependencies
        working-directory: extracted
        shell: bash
        run: |
          npm install --no-audit --no-fund --no-progress

      - name: Enable native Google authentication
        working-directory: extracted
        shell: bash
        run: |
          echo "JEE_NATIVE_GOOGLE_AUTH=1" >> "$GITHUB_ENV"

      - name: Add Capacitor Android
        working-directory: extracted
        shell: bash
        run: |
          npx cap add android

      - name: Apply native Android widgets
        working-directory: extracted
        shell: bash
        run: |
          python3 native-android/apply-widgets.py

      - name: Configure Firebase Android
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          test -f firebase/google-services.json

          cp firebase/google-services.json \
             android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android")
          root_gradle = root / "build.gradle"
          app_gradle = root / "app" / "build.gradle"
          variables = root / "variables.gradle"

          if variables.exists():
              s = variables.read_text()

              if "rgcfaIncludeGoogle" not in s:
                  if "ext {" in s:
                      s = s.replace(
                          "ext {",
                          "ext {\n"
                          "    rgcfaIncludeGoogle = true\n"
                          "    androidxCredentialsVersion = '1.3.0'",
                          1
                      )
                  else:
                      s = (
                          "ext {\n"
                          "    rgcfaIncludeGoogle = true\n"
                          "    androidxCredentialsVersion = '1.3.0'\n"
                          "}\n\n"
                          + s
                      )

                  variables.write_text(s)

          s = root_gradle.read_text()

          if "com.google.gms.google-services" not in s:
              if s.lstrip().startswith("plugins {"):
                  s = s.replace(
                      "plugins {",
                      "plugins {\n"
                      "    id 'com.google.gms.google-services' "
                      "version '4.5.0' apply false",
                      1
                  )
              else:
                  s = (
                      "buildscript { "
                      "repositories { google(); mavenCentral() }; "
                      "dependencies { "
                      "classpath 'com.google.gms:google-services:4.5.0' "
                      "} "
                      "}\n\n"
                      + s
                  )

              root_gradle.write_text(s)

          s = app_gradle.read_text()

          if "com.google.gms.google-services" not in s:
              if s.lstrip().startswith("plugins {"):
                  s = s.replace(
                      "plugins {",
                      "plugins {\n"
                      "    id 'com.google.gms.google-services'",
                      1
                  )
              else:
                  s += (
                      "\napply plugin: "
                      "'com.google.gms.google-services'\n"
                  )

              app_gradle.write_text(s)
          PY

      - name: Sync Capacitor
        working-directory: extracted
        shell: bash
        run: |
          npx cap sync android

      - name: Verify generated Android project
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/google-services.json
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/build.gradle

          for widget in \
            JeeTodayWidgetProvider \
            JeeTestScoreWidgetProvider \
            JeeNextMissionWidgetProvider
          do
            grep -R \
              "android:name=\"com.vedplayer.jeetracker.${widget}\"" \
              android/app/src/main/AndroidManifest.xml >/dev/null
          done

          echo "Generated Android project checks passed."

      - name: Make Gradle executable
        working-directory: extracted/android
        shell: bash
        run: |
          chmod +x gradlew

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show signing report
        working-directory: extracted/android
        shell: bash
        run: |
          ./gradlew signingReport --stacktrace

      - name: Build debug APK
        working-directory: extracted/android
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        working-directory: extracted/android
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK: $APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jee-tracker-debug-apk
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
