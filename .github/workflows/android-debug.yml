name: Build JEE Tracker Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  PROJECT_ZIP: JEE-Tracker-Android-Native-Feel-Fixed.zip
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_ZIP"

          echo "ZIP:"
          ls -lh "$PROJECT_ZIP"

          unzip -tq "$PROJECT_ZIP"

          echo "ZIP integrity OK"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "$PROJECT_ZIP" -d project

          echo "Extracted project:"
          find project -maxdepth 2 -type f | sort | head -200

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f project/firebase/google-services.json

          python3 - <<'PY'
          import json

          p = "project/firebase/google-services.json"

          with open(p, "r", encoding="utf-8") as f:
              data = json.load(f)

          project_id = data["project_info"]["project_id"]

          client = data["client"][0]
          package_name = client["client_info"]["android_client_info"]["package_name"]
          app_id = client["client_info"]["mobilesdk_app_id"]

          print("Firebase project:", project_id)
          print("Android package:", package_name)
          print("Firebase app ID:", app_id)

          assert project_id == "jee2027-9d55a"
          assert package_name == "com.vedplayer.jeetracker"
          assert app_id == "1:450231967529:android:edd1b09ea64992d071e138"

          print("Firebase configuration OK")
          PY

      - name: Install npm dependencies
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Enable native Google authentication
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          export JEE_NATIVE_GOOGLE_AUTH=1

          echo "JEE_NATIVE_GOOGLE_AUTH=$JEE_NATIVE_GOOGLE_AUTH"

      - name: Build web application
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No npm build script found; using existing www directory."
          fi

          test -d www
          test -f www/index.html

      - name: Prepare Capacitor
        working-directory: project
        shell: bash
        env:
          JEE_NATIVE_GOOGLE_AUTH: '1'
        run: |
          set -euo pipefail

          rm -rf android

          npx cap add android

      - name: Install Firebase configuration
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app

          cp firebase/google-services.json \
             android/app/google-services.json

          test -f android/app/google-services.json

      - name: Configure Firebase Android Gradle plugin
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")

          root_text = root.read_text()

          if "com.google.gms:google-services" not in root_text:
              root_text += """
          dependencies {
              classpath 'com.google.gms:google-services:4.5.0'
          }
          """

          root.write_text(root_text)

          app_text = app.read_text()

          if "com.google.gms.google-services" not in app_text:
              app_text += """

          apply plugin: 'com.google.gms.google-services'
          """

          app.write_text(app_text)
          PY

      - name: Configure Capacitor Firebase Authentication
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          test -f capacitor.config.ts

          grep -q "FirebaseAuthentication" capacitor.config.ts
          grep -q "google.com" capacitor.config.ts

          echo "Native Firebase Authentication configuration found."

      - name: Apply Android native widgets
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f native-android/apply-widgets.py ]; then
            python3 native-android/apply-widgets.py
          else
            echo "Widget patch script not found; continuing."
          fi

      - name: Verify native touch layer
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          test -f www/native-touch.css

          grep -q "native-android" www/native-touch.css

          echo "Native Android touch layer found."

      - name: Sync Capacitor
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

      - name: Verify Firebase package and app ID
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          grep -R "com.vedplayer.jeetracker" android/app \
            --include="*.gradle" \
            --include="*.xml" \
            --include="*.json" \
            | head -50

          grep -R "1:450231967529:android:edd1b09ea64992d071e138" android \
            --include="google-services.json"

          echo "Firebase Android identifiers verified."

      - name: Generate signing report
        working-directory: project/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew signingReport

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: project/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK created:"
          ls -lh "$APK"

          sha256sum "$APK" | tee apk-sha256.txt

      - name: Collect build files
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../apk-output

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             ../apk-output/JEE-Tracker-debug.apk

          cp apk-sha256.txt \
             ../apk-output/

          if [ -f android/app/build/outputs/apk/debug/output-metadata.json ]; then
            cp android/app/build/outputs/apk/debug/output-metadata.json \
               ../apk-output/
          fi

          echo "Final artifacts:"
          ls -lh ../apk-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: JEE-Tracker-debug-apk
          path: apk-output/
          if-no-files-found: error
