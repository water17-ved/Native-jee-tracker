name: Build JEE Tracker Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  PROJECT_ZIP: 'JEE-Tracker-Android-Native-Feel-Fixed-v2.zip'

jobs:
  build-debug:
    name: Extract, configure native features and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/$PROJECT_ZIP"

          test -f "$ZIP"

          echo "Checking ZIP integrity..."
          unzip -tq "$ZIP"

          echo "Checking required project files..."

          for f in \
            package.json \
            capacitor.config.ts \
            tsconfig.json \
            www/index.html \
            www/schedule.html \
            www/test-analysis.html \
            www/jee-android-native.js \
            www/jee-widgets.js \
            www/native-touch.css \
            native-android/apply-widgets.py \
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeWidgetsPlugin.java \
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeWidgetProvider.java \
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeMarksWidgetProvider.java \
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeFocusWidgetProvider.java \
            firebase/google-services.json \
            assets/icon-only.png \
            assets/logo.png \
            www/icon-192.png \
            www/icon-512.png
          do
            unzip -Z1 "$ZIP" | grep -Fxq "$f" || {
              echo "ERROR: missing $f"
              exit 1
            }
          done

          echo "ZIP verification PASSED."

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "$GITHUB_WORKSPACE/$PROJECT_ZIP" -d extracted

          test -f extracted/package.json

          echo "Project extracted successfully."

      - name: Validate Firebase Android identity
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          with open("firebase/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          client = data["client"][0]

          package_name = client["client_info"]["android_client_info"]["package_name"]
          app_id = client["client_info"]["mobilesdk_app_id"]

          print("Firebase package:", package_name)
          print("Firebase app ID:", app_id)

          assert package_name == "com.vedplayer.jeetracker"
          assert app_id == "1:450231967529:android:edd1b09ea64992d071e138"

          print("Firebase identity PASSED.")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate npm project
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json

          node -e "
            const p = require('./package.json');
            if (!p.dependencies?.['@capacitor/core']) process.exit(1);
            if (!p.devDependencies?.['@capacitor/android']) process.exit(1);
            if (!p.devDependencies?.['@capacitor/cli']) process.exit(1);
            console.log('package.json OK');
          "

      - name: Install npm dependencies
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund --no-progress

      - name: Enable native Google Sign-In
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          test -s firebase/google-services.json

          echo "JEE_NATIVE_GOOGLE_AUTH=1" >> "$GITHUB_ENV"

      - name: Add Capacitor Android platform
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          npx cap add android

      - name: Apply native Android widgets
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          python3 native-android/apply-widgets.py

      - name: Configure Firebase Android
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app

          cp firebase/google-services.json \
             android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android")
          app = root / "app" / "build.gradle"
          rg = root / "build.gradle"
          vg = root / "variables.gradle"

          # Firebase Authentication native Google support
          if vg.exists():
              text = vg.read_text()

              if "rgcfaIncludeGoogle" not in text:
                  text = text.replace(
                      "ext {",
                      "ext {\n"
                      "    rgcfaIncludeGoogle = true\n"
                      "    androidxCredentialsVersion = '1.3.0'",
                      1
                  )

                  vg.write_text(text)

          # Google Services Gradle plugin
          text = rg.read_text()

          if "com.google.gms.google-services" not in text:
              if text.lstrip().startswith("plugins {"):
                  text = text.replace(
                      "plugins {",
                      "plugins {\n"
                      "    id 'com.google.gms.google-services' version '4.5.0' apply false",
                      1
                  )
              else:
                  text = (
                      "buildscript {\n"
                      "    repositories {\n"
                      "        google()\n"
                      "        mavenCentral()\n"
                      "    }\n"
                      "    dependencies {\n"
                      "        classpath 'com.google.gms:google-services:4.5.0'\n"
                      "    }\n"
                      "}\n\n"
                      + text
                  )

              rg.write_text(text)

          # Apply plugin to app module
          text = app.read_text()

          if "com.google.gms.google-services" not in text:
              if text.lstrip().startswith("plugins {"):
                  text = text.replace(
                      "plugins {",
                      "plugins {\n"
                      "    id 'com.google.gms.google-services'",
                      1
                  )
              else:
                  text += "\napply plugin: 'com.google.gms.google-services'\n"

              app.write_text(text)
          PY

      - name: Sync Capacitor
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

      - name: Verify native Android integration
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/google-services.json

          grep -q "rgcfaIncludeGoogle" android/variables.gradle
          grep -q "androidxCredentialsVersion" android/variables.gradle

          grep -R -q \
            "com.google.gms.google-services" \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts"

          grep -q \
            "JeeWidgetProvider" \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "JeeMarksWidgetProvider" \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "JeeFocusWidgetProvider" \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "const _authDomain = 'jee2027-9d55a.firebaseapp.com'" \
            www/index.html

          grep -q \
            "JEEAndroidNotifications.*notify" \
            www/jee-android-native.js

          echo "Native Android integration PASSED."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Firebase debug SHA-1 report
        working-directory: extracted/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew signingReport --no-daemon \
            > ../signing-report.txt 2>&1

          grep -E "SHA1:|SHA-1:" \
            ../signing-report.txt

      - name: Build debug APK
        working-directory: extracted/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          SIZE=$(stat -c%s "$APK")

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK is suspiciously small."
            exit 1
          fi

          sha256sum "$APK" | tee app-debug.apk.sha256

      - name: Upload APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Tracker-debug-APK-final
          path: |
            extracted/android/app/build/outputs/apk/debug/app-debug.apk
            extracted/app-debug.apk.sha256
            extracted/signing-report.txt
          if-no-files-found: error
          retention-days: 30
