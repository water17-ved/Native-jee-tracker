name: Build JEE Tracker Debug APK

on:
  workflow_dispatch:

  push:
    paths:
      - '**.zip'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ------------------------------------------------------------
      # 2. FIND THE LATEST PROJECT ZIP
      # ------------------------------------------------------------

      - name: Locate latest project ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name '*.zip' \
              -printf '%f\n' |
            sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ${#ZIPS[@]} ZIP file(s):"
          printf '  - %s\n' "${ZIPS[@]}"

          latest_name=""
          latest_time=-1

          for zip_name in "${ZIPS[@]}"; do

            commit_time="$(
              git log -1 \
                --format=%ct \
                -- "$zip_name" 2>/dev/null || true
            )"

            if [ -z "$commit_time" ]; then
              commit_time=0
            fi

            echo "Git timestamp: $commit_time -> $zip_name"

            if [ "$commit_time" -gt "$latest_time" ]; then
              latest_time="$commit_time"
              latest_name="$zip_name"

            elif [ "$commit_time" -eq "$latest_time" ] &&
                 [[ "$zip_name" > "$latest_name" ]]; then

              latest_name="$zip_name"
            fi

          done

          if [ -z "$latest_name" ]; then
            echo "ERROR: Could not determine latest ZIP."
            exit 1
          fi

          echo "zip_name=$latest_name" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================="
          echo "LATEST PROJECT ZIP SELECTED:"
          echo "$latest_name"
          echo "=========================================="
          echo ""


      # ------------------------------------------------------------
      # 3. VERIFY ZIP
      # ------------------------------------------------------------

      - name: Verify latest project ZIP
        shell: bash
        env:
          ZIP_NAME: ${{ steps.locate_zip.outputs.zip_name }}
        run: |
          set -euo pipefail

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERROR: Selected ZIP does not exist:"
            echo "$ZIP_NAME"
            exit 1
          fi

          echo "Verifying:"
          echo "$ZIP_NAME"
          echo ""

          unzip -tq "$ZIP_NAME"

          echo "ZIP integrity: PASS"
          echo ""

          required=(
            "package.json"
            "capacitor.config.ts"
            "tsconfig.json"

            "www/index.html"
            "www/schedule.html"
            "www/test-analysis.html"

            "www/jee-android-native.js"
            "www/jee-widgets.js"
            "www/native-touch.css"

            "native-android/apply-widgets.py"

            "native-android/app/src/main/java/com/vedplayer/jeetracker/JeeWidgetProvider.java"
            "native-android/app/src/main/java/com/vedplayer/jeetracker/JeeMarksWidgetProvider.java"
            "native-android/app/src/main/java/com/vedplayer/jeetracker/JeeFocusWidgetProvider.java"
            "native-android/app/src/main/java/com/vedplayer/jeetracker/JeeWidgetsPlugin.java"

            "firebase/google-services.json"

            "assets/icon-only.png"
            "assets/logo.png"

            "www/icon-192.png"
            "www/icon-512.png"
          )

          ZIP_LIST="$(unzip -Z1 "$ZIP_NAME")"

          for path in "${required[@]}"; do

            if ! grep -Fxq "$path" <<< "$ZIP_LIST"; then
              echo "ERROR: Missing required file:"
              echo "$path"
              exit 1
            fi

            echo "OK: $path"
          done

          echo ""
          echo "=========================================="
          echo "ZIP VERIFICATION PASSED"
          echo "=========================================="
          echo ""


      # ------------------------------------------------------------
      # 4. EXTRACT
      # ------------------------------------------------------------

      - name: Extract latest project
        env:
          ZIP_NAME: ${{ steps.locate_zip.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted

          mkdir -p extracted

          unzip -q "$ZIP_NAME" -d extracted

          if [ ! -f "extracted/package.json" ]; then
            echo "ERROR: package.json was not found at extracted project root."

            echo ""
            echo "Extracted structure:"
            find extracted -maxdepth 2 -type f | sort | head -100

            exit 1
          fi

          echo "Project extraction successful."


      # ------------------------------------------------------------
      # 5. VALIDATE PACKAGE
      # ------------------------------------------------------------

      - name: Validate package.json
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          const required = [
            ['dependencies', '@capacitor/core'],
            ['dependencies', '@capacitor/haptics'],
            ['dependencies', '@capacitor/local-notifications'],
            ['dependencies', '@capacitor-firebase/authentication'],
            ['devDependencies', '@capacitor/cli'],
            ['devDependencies', '@capacitor/android']
          ];

          for (const [group, name] of required) {
            if (!pkg[group] || !pkg[group][name]) {
              throw new Error(
                `Missing ${group}.${name}`
              );
            }

            console.log(
              `OK: ${group}.${name} = ${pkg[group][name]}`
            );
          }

          console.log('');
          console.log('package.json validation passed.');
          NODE


      # ------------------------------------------------------------
      # 6. NODE
      # ------------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # ------------------------------------------------------------
      # 7. INSTALL DEPENDENCIES
      # ------------------------------------------------------------

      - name: Install npm dependencies
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --no-audit \
            --no-fund \
            --no-progress


      # ------------------------------------------------------------
      # 8. ENABLE NATIVE GOOGLE AUTH
      # ------------------------------------------------------------

      - name: Enable native Google authentication
        shell: bash
        run: |
          echo "JEE_NATIVE_GOOGLE_AUTH=1" >> "$GITHUB_ENV"

          echo "Native Google authentication enabled."


      # ------------------------------------------------------------
      # 9. CREATE ANDROID PROJECT
      # ------------------------------------------------------------

      - name: Add Capacitor Android
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android


      # ------------------------------------------------------------
      # 10. APPLY WIDGETS
      # ------------------------------------------------------------

      - name: Apply native Android widgets
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          python3 native-android/apply-widgets.py

          echo ""
          echo "Checking exact widget providers..."

          test -f \
            android/app/src/main/java/com/vedplayer/jeetracker/JeeWidgetProvider.java

          test -f \
            android/app/src/main/java/com/vedplayer/jeetracker/JeeMarksWidgetProvider.java

          test -f \
            android/app/src/main/java/com/vedplayer/jeetracker/JeeFocusWidgetProvider.java

          test -f \
            android/app/src/main/java/com/vedplayer/jeetracker/JeeWidgetsPlugin.java

          echo "All exact widget provider files copied successfully."


      # ------------------------------------------------------------
      # 11. FIREBASE
      # ------------------------------------------------------------

      - name: Configure Firebase Android
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          test -f firebase/google-services.json

          cp \
            firebase/google-services.json \
            android/app/google-services.json

          echo "Firebase configuration copied."


      # ------------------------------------------------------------
      # 12. CONFIGURE GOOGLE SERVICES GRADLE PLUGIN
      # ------------------------------------------------------------

      - name: Configure Google Services Gradle plugin
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android")

          root_gradle = root / "build.gradle"
          app_gradle = root / "app" / "build.gradle"
          variables_gradle = root / "variables.gradle"

          # --------------------------------------------------------
          # variables.gradle
          # --------------------------------------------------------

          if variables_gradle.exists():

              text = variables_gradle.read_text()

              if "rgcfaIncludeGoogle" not in text:

                  if "ext {" in text:

                      text = text.replace(
                          "ext {",
                          (
                              "ext {\n"
                              "    rgcfaIncludeGoogle = true\n"
                              "    androidxCredentialsVersion = '1.3.0'"
                          ),
                          1
                      )

                  else:

                      text = (
                          "ext {\n"
                          "    rgcfaIncludeGoogle = true\n"
                          "    androidxCredentialsVersion = '1.3.0'\n"
                          "}\n\n"
                          + text
                      )

                  variables_gradle.write_text(text)

          # --------------------------------------------------------
          # root build.gradle
          # --------------------------------------------------------

          text = root_gradle.read_text()

          if "com.google.gms.google-services" not in text:

              if text.lstrip().startswith("plugins {"):

                  text = text.replace(
                      "plugins {",
                      (
                          "plugins {\n"
                          "    id 'com.google.gms.google-services' "
                          "version '4.5.0' apply false"
                      ),
                      1
                  )

              else:

                  text = (
                      "buildscript {\n"
                      "    repositories {\n"
                      "        google()\n"
                      "        mavenCentral()\n"
                      "    }\n"
                      "    dependencies {\n"
                      "        classpath "
                      "'com.google.gms:google-services:4.5.0'\n"
                      "    }\n"
                      "}\n\n"
                      + text
                  )

              root_gradle.write_text(text)

          # --------------------------------------------------------
          # app build.gradle
          # --------------------------------------------------------

          text = app_gradle.read_text()

          if "com.google.gms.google-services" not in text:

              if text.lstrip().startswith("plugins {"):

                  text = text.replace(
                      "plugins {",
                      (
                          "plugins {\n"
                          "    id 'com.google.gms.google-services'"
                      ),
                      1
                  )

              else:

                  text += (
                      "\n"
                      "apply plugin: "
                      "'com.google.gms.google-services'\n"
                  )

              app_gradle.write_text(text)

          print("Google Services Gradle configuration completed.")
          PY


      # ------------------------------------------------------------
      # 13. CAPACITOR SYNC
      # ------------------------------------------------------------

      - name: Sync Capacitor
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android


      # ------------------------------------------------------------
      # 14. VERIFY GENERATED ANDROID PROJECT
      # ------------------------------------------------------------

      - name: Verify generated Android project
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/google-services.json
          test -f android/gradlew
          test -f android/build.gradle
          test -f android/app/build.gradle

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          echo "Checking exact widget receivers..."

          grep -q \
            'android:name=".JeeWidgetProvider"' \
            "$MANIFEST"

          grep -q \
            'android:name=".JeeMarksWidgetProvider"' \
            "$MANIFEST"

          grep -q \
            'android:name=".JeeFocusWidgetProvider"' \
            "$MANIFEST"

          echo ""
          echo "Checking Google Services plugin..."

          grep -R \
            "com.google.gms.google-services" \
            android \
            >/dev/null

          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT VERIFICATION PASSED"
          echo "=========================================="
          echo ""


      # ------------------------------------------------------------
      # 15. JAVA
      # ------------------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ------------------------------------------------------------
      # 16. GRADLE
      # ------------------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ------------------------------------------------------------
      # 17. GRADLE PERMISSION
      # ------------------------------------------------------------

      - name: Make Gradle executable
        working-directory: extracted/android
        shell: bash
        run: |
          chmod +x gradlew


      # ------------------------------------------------------------
      # 18. SIGNING REPORT
      # ------------------------------------------------------------

      - name: Generate signing report
        working-directory: extracted/android
        shell: bash
        run: |
          ./gradlew signingReport --stacktrace


      # ------------------------------------------------------------
      # 19. BUILD APK
      # ------------------------------------------------------------

      - name: Build debug APK
        working-directory: extracted/android
        shell: bash
        run: |
          ./gradlew \
            assembleDebug \
            --stacktrace \
            --no-daemon


      # ------------------------------------------------------------
      # 20. VERIFY APK
      # ------------------------------------------------------------

      - name: Verify APK
        working-directory: extracted/android
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "APK BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""

          ls -lh "$APK"

          echo ""
          echo "SHA-256:"
          sha256sum "$APK"


      # ------------------------------------------------------------
      # 21. UPLOAD APK
      # ------------------------------------------------------------

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jee-tracker-debug-apk
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
