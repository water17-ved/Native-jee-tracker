name: Build JEE Tracker Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'

jobs:
  build-debug:
    name: Extract and Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =========================================================
      # FIND LATEST ZIP
      # =========================================================

      - name: Locate latest project ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name '*.zip' \
              -printf '%f\n' \
              | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi

          echo "ZIP files found:"
          printf ' - %s\n' "${ZIPS[@]}"

          latest_name=""
          latest_time=-1

          for zip_name in "${ZIPS[@]}"; do
            commit_time="$(
              git log -1 \
                --format=%ct \
                -- "$zip_name" 2>/dev/null || true
            )"

            if [ -z "$commit_time" ]; then
              commit_time=0
            fi

            if [ "$commit_time" -gt "$latest_time" ]; then
              latest_time="$commit_time"
              latest_name="$zip_name"
            elif [ "$commit_time" -eq "$latest_time" ] && \
                 [[ "$zip_name" > "$latest_name" ]]; then
              latest_name="$zip_name"
            fi
          done

          if [ -z "$latest_name" ]; then
            echo "ERROR: Could not determine latest project ZIP."
            exit 1
          fi

          echo "zip_name=$latest_name" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Using project ZIP:"
          echo "$latest_name"


      # =========================================================
      # VERIFY ZIP
      # =========================================================

      - name: Verify project ZIP
        env:
          ZIP_NAME: ${{ steps.locate_zip.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/$ZIP_NAME"

          echo "Testing ZIP integrity..."
          unzip -tq "$ZIP"

          REQUIRED=(
            package.json
            capacitor.config.ts
            tsconfig.json

            www/index.html
            www/schedule.html
            www/test-analysis.html
            www/jee-android-native.js
            www/jee-widgets.js
            www/native-touch.css

            native-android/apply-widgets.py

            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeWidgetsPlugin.java
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeWidgetProvider.java
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeMarksWidgetProvider.java
            native-android/app/src/main/java/com/vedplayer/jeetracker/JeeFocusWidgetProvider.java

            firebase/google-services.json

            assets/icon-only.png
            assets/logo.png

            www/icon-192.png
            www/icon-512.png
          )

          LISTING="$(unzip -Z1 "$ZIP")"

          for file in "${REQUIRED[@]}"; do
            if ! printf '%s\n' "$LISTING" | grep -Fxq "$file"; then
              echo "ERROR: ZIP is missing:"
              echo "$file"
              exit 1
            fi
          done

          echo "Project ZIP verification PASSED."


      # =========================================================
      # EXTRACT
      # =========================================================

      - name: Extract project ZIP
        env:
          ZIP_NAME: ${{ steps.locate_zip.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o \
            "$GITHUB_WORKSPACE/$ZIP_NAME" \
            -d extracted

          test -f extracted/package.json

          echo "Project extracted successfully."


      # =========================================================
      # VALIDATE FIREBASE
      # =========================================================

      - name: Validate Firebase Android identity
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("firebase/google-services.json")

          if not path.is_file():
              raise SystemExit(
                  "ERROR: firebase/google-services.json is missing."
              )

          data = json.loads(path.read_text())

          expected_package = "com.vedplayer.jeetracker"

          expected_app_id = (
              "1:450231967529:android:"
              "edd1b09ea64992d071e138"
          )

          clients = data.get("client")

          if not isinstance(clients, list) or not clients:
              raise SystemExit(
                  "ERROR: No Firebase client entries found."
              )

          matched = False

          for client in clients:

              client_info = client.get("client_info", {})

              android_info = client_info.get(
                  "android_client_info", {}
              )

              package_name = android_info.get(
                  "package_name"
              )

              print(
                  "Firebase client:",
                  package_name
              )

              if package_name != expected_package:
                  continue

              matched = True

              app_id = client_info.get(
                  "mobilesdk_app_id"
              )

              if not app_id:
                  raise SystemExit(
                      "ERROR: Matching Firebase Android "
                      "client has no "
                      "client_info.mobilesdk_app_id."
                  )

              if app_id != expected_app_id:
                  raise SystemExit(
                      "ERROR: Firebase App ID mismatch.\n"
                      f"Expected: {expected_app_id}\n"
                      f"Found:    {app_id}"
                  )

              print("")
              print("Firebase package:", package_name)
              print("Firebase App ID:", app_id)
              print("Firebase identity PASSED.")

              break

          if not matched:
              raise SystemExit(
                  "ERROR: Firebase Android package "
                  f"{expected_package} was not found."
              )
          PY


      # =========================================================
      # NODE
      # =========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false


      # =========================================================
      # JAVA 21
      # =========================================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

          JAVA_MAJOR="$(
            java -version 2>&1 |
            sed -n 's/.*version "\([0-9]*\).*/\1/p' |
            head -n 1
          )"

          if [ "$JAVA_MAJOR" != "21" ]; then
            echo "ERROR: Java 21 required."
            exit 1
          fi

          echo "Java 21 validation PASSED."


      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # VALIDATE PACKAGE
      # =========================================================

      - name: Validate npm project
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          node -e "
            const p = require('./package.json');

            const required = [
              ['dependencies', '@capacitor/core'],
              ['dependencies', '@capacitor/haptics'],
              ['dependencies', '@capacitor/local-notifications'],
              ['dependencies', '@capacitor-firebase/authentication'],
              ['devDependencies', '@capacitor/cli'],
              ['devDependencies', '@capacitor/android']
            ];

            for (const [group, name] of required) {
              if (!p[group] || !p[group][name]) {
                console.error('Missing ' + group + '.' + name);
                process.exit(1);
              }
            }

            console.log('package.json validation PASSED.');
          "


      # =========================================================
      # NPM
      # =========================================================

      - name: Install npm dependencies
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --no-audit \
            --no-fund \
            --no-progress


      # =========================================================
      # NATIVE GOOGLE AUTH
      # =========================================================

      - name: Enable native Google Sign-In
        shell: bash
        run: |
          echo "JEE_NATIVE_GOOGLE_AUTH=1" >> "$GITHUB_ENV"


      # =========================================================
      # CAPACITOR ANDROID
      # =========================================================

      - name: Add Capacitor Android
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          npx cap add android


      # =========================================================
      # WIDGETS
      # =========================================================

      - name: Apply native Android widgets
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          python3 native-android/apply-widgets.py


      # =========================================================
      # FIREBASE ANDROID CONFIG
      # =========================================================

      - name: Configure Firebase Android
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app

          cp \
            firebase/google-services.json \
            android/app/google-services.json

          test -s android/app/google-services.json

          echo "Firebase google-services.json installed."


      # =========================================================
      # FIREBASE GRADLE INTEGRATION
      # =========================================================

      - name: Configure Firebase Android Gradle integration
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android")

          app = root / "app" / "build.gradle"
          project = root / "build.gradle"
          variables = root / "variables.gradle"

          # -------------------------------------------------------
          # variables.gradle
          # -------------------------------------------------------

          if variables.exists():

              text = variables.read_text()

              if "rgcfaIncludeGoogle" not in text:

                  if "ext {" in text:

                      text = text.replace(
                          "ext {",
                          "ext {\n"
                          "    rgcfaIncludeGoogle = true\n"
                          "    androidxCredentialsVersion = '1.3.0'",
                          1
                      )

                  else:

                      text += (
                          "\n"
                          "ext {\n"
                          "    rgcfaIncludeGoogle = true\n"
                          "    androidxCredentialsVersion = '1.3.0'\n"
                          "}\n"
                      )

              else:

                  lines = text.splitlines()
                  updated = []

                  for line in lines:

                      if "rgcfaIncludeGoogle" in line:

                          indent = line[
                              :len(line) - len(line.lstrip())
                          ]

                          updated.append(
                              indent +
                              "rgcfaIncludeGoogle = true"
                          )

                      else:

                          updated.append(line)

                  text = "\n".join(updated) + "\n"

                  if "androidxCredentialsVersion" not in text:

                      text = text.replace(
                          "rgcfaIncludeGoogle = true",
                          "rgcfaIncludeGoogle = true\n"
                          "    androidxCredentialsVersion = '1.3.0'",
                          1
                      )

              variables.write_text(text)

          # -------------------------------------------------------
          # project build.gradle
          # -------------------------------------------------------

          text = project.read_text()

          if "com.google.gms.google-services" not in text:

              if text.lstrip().startswith("plugins {"):

                  text = text.replace(
                      "plugins {",
                      "plugins {\n"
                      "    id 'com.google.gms.google-services' "
                      "version '4.5.0' apply false",
                      1
                  )

              else:

                  prefix = (
                      "buildscript {\n"
                      "    repositories {\n"
                      "        google()\n"
                      "        mavenCentral()\n"
                      "    }\n"
                      "    dependencies {\n"
                      "        classpath "
                      "'com.google.gms:google-services:4.5.0'\n"
                      "    }\n"
                      "}\n\n"
                  )

                  text = prefix + text

              project.write_text(text)

          # -------------------------------------------------------
          # app build.gradle
          # -------------------------------------------------------

          text = app.read_text()

          if "com.google.gms.google-services" not in text:

              if text.lstrip().startswith("plugins {"):

                  text = text.replace(
                      "plugins {",
                      "plugins {\n"
                      "    id 'com.google.gms.google-services'",
                      1
                  )

              else:

                  text += (
                      "\n"
                      "apply plugin: "
                      "'com.google.gms.google-services'\n"
                  )

              app.write_text(text)

          print("Firebase Gradle integration configured.")
          PY


      # =========================================================
      # CAPACITOR SYNC
      # =========================================================

      - name: Sync Capacitor
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android


      # =========================================================
      # DEBUG KEYSTORE
      # =========================================================

      - name: Prepare Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$HOME/.android/debug.keystore"

          mkdir -p "$HOME/.android"

          if [ ! -f "$KEYSTORE" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          test -f "$KEYSTORE"

          echo "Debug keystore ready."


      # =========================================================
      # VERIFY GENERATED PROJECT
      # =========================================================

      - name: Verify generated Android project
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradlew
          test -f android/app/google-services.json
          test -f android/app/src/main/AndroidManifest.xml

          grep -q \
            "JeeWidgetProvider" \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "JeeMarksWidgetProvider" \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "JeeFocusWidgetProvider" \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "com.google.gms.google-services" \
            android/app/build.gradle

          echo "Generated Android project validation PASSED."


      # =========================================================
      # GRADLE
      # =========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6


      - name: Show build environment
        working-directory: extracted/android
        shell: bash
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== JAVAC ====="
          javac -version

          echo ""
          echo "===== GRADLE ====="

          chmod +x gradlew

          ./gradlew --version


      # =========================================================
      # SIGNING REPORT
      # =========================================================

      - name: Generate signing report
        working-directory: extracted/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew signingReport \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../signing-report.txt


      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build debug APK
        working-directory: extracted/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log


      # =========================================================
      # VERIFY APK
      # =========================================================

      - name: Verify APK
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK is suspiciously small."
            exit 1
          fi

          sha256sum "$APK" \
            | tee app-debug.apk.sha256

          echo "APK verification PASSED."


      # =========================================================
      # UPLOAD
      # =========================================================

      - name: Upload APK and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Tracker-debug-APK
          path: |
            extracted/android/app/build/outputs/apk/debug/app-debug.apk
            extracted/app-debug.apk.sha256
            extracted/signing-report.txt
            extracted/gradle-build.log
          if-no-files-found: warn
          retention-days: 30
